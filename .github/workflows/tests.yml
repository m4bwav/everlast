# The self-test on the three operating systems the protocol promises (PORTABILITY.md), on every push and pull request.
name: tests
on:
  push:
    branches: [master]
  pull_request:
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: git identity for the fixtures that commit
        run: |
          git config --global user.name "everlast-ci"
          git config --global user.email "ci@example.com"
      - name: self-test
        env:
          EVERLAST_VAULT: ${{ runner.temp }}/everlast-vault
        run: python scripts/test_everlast.py
      - name: sh hook smoke run (SessionStart must exit 0)
        shell: bash
        env:
          EVERLAST_VAULT: ${{ runner.temp }}/everlast-vault
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
        run: |
          echo '{"hook_event_name":"SessionStart","cwd":"'"$GITHUB_WORKSPACE"'","session_id":"ci"}' | sh scripts/everlast-hook.sh
